name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Lint notebooks
        run: uv run nbqa ruff notebooks/ --ignore E402,E702
      - name: Tests
        run: uv run pytest -q
